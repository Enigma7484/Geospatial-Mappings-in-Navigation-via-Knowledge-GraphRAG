name: Deploy Hugging Face Space

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "data/user_histories_osm_trace.json"
      - "Dockerfile"
      - "requirements-deploy.txt"
      - ".github/workflows/deploy-huggingface-space.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.HF_SPACE_ID != '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Space payload
        run: |
          mkdir -p /tmp/georoute-space/app /tmp/georoute-space/data
          rsync -a --delete app/ /tmp/georoute-space/app/
          rsync -a data/user_histories_osm_trace.json /tmp/georoute-space/data/user_histories_osm_trace.json
          rsync -a Dockerfile /tmp/georoute-space/Dockerfile
          rsync -a requirements-deploy.txt /tmp/georoute-space/requirements-deploy.txt
          cat > /tmp/georoute-space/README.md <<'README'
          ---
          title: GeoRoute Preference API
          emoji: 🗺️
          colorFrom: blue
          colorTo: green
          sdk: docker
          app_port: 7860
          pinned: false
          license: mit
          ---

          # GeoRoute Preference API

          FastAPI backend for preference-aware route ranking with OpenStreetMap-derived route candidates.
          README

      - name: Push to Hugging Face Space
        env:
          HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is required." >&2
            exit 1
          fi

          cd /tmp/georoute-space
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Deploy GeoRoute backend from ${GITHUB_SHA}"
          git branch -M main
          git remote add space "https://huggingface.co/spaces/${HF_SPACE_ID}"
          git -c "http.https://huggingface.co/.extraheader=Authorization: Bearer ${HF_TOKEN}" push --force space main
